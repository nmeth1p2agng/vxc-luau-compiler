<script>
"use strict";

const $ = id => document.getElementById(id);

const sourceEl = $("source");
const outputEl = $("output");
const protectBtn = $("protectBtn");
const statusEl = $("status");
const outputStatusEl = $("outputStatus");
const logEl = $("log");

function setStatus(message, type = "") {
  statusEl.textContent = message;
  statusEl.className = "status " + type;
}

function setOutputStatus(message, type = "") {
  outputStatusEl.textContent = message;
  outputStatusEl.className = "status " + type;
}

function log(message) {
  logEl.textContent +=
    "\n[" + new Date().toLocaleTimeString() + "] " + message;

  logEl.scrollTop = logEl.scrollHeight;
}

function resetStats() {
  $("originalSize").textContent = "—";
  $("outputSize").textContent = "—";
  $("sizeDifference").textContent = "—";
}

function resetOutput() {
  outputEl.value = "";
  resetStats();

  $("processingState").textContent = "Idle";
  $("outputFormat").textContent = "Luau source";
}

function bytes(text) {
  return new TextEncoder().encode(text).length;
}

/* =========================================
   PROTECT SOURCE
========================================= */

protectBtn.addEventListener("click", async () => {
  const source = sourceEl.value;

  if (!source.trim()) {
    setStatus("Please enter Luau source code first.", "error");
    return;
  }

  if (source.length > 100000) {
    setStatus(
      "Source exceeds the 100,000 character limit.",
      "error"
    );
    return;
  }

  protectBtn.disabled = true;
  protectBtn.textContent = "Processing...";

  outputEl.value = "";
  resetStats();

  setOutputStatus("Processing source...");
  $("processingState").textContent = "Running";

  logEl.textContent = "[VXC] Starting protection request.";

  try {
    setStatus("Sending source to the Protector API...");
    log("Source length: " + source.length + " characters.");

    const response = await fetch("/api/run", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ source })
    });

    log("HTTP status: " + response.status);

    let data;

    try {
      data = await response.json();
    } catch {
      throw new Error(
        "API did not return JSON. Check the Vercel deployment."
      );
    }

    if (!response.ok || !data.success) {
      throw new Error(
        data.error || "Protection request failed."
      );
    }

    if (typeof data.output !== "string") {
      throw new Error(
        "API response is missing the output source."
      );
    }

    outputEl.value = data.output;

    const originalBytes = bytes(source);
    const outputBytes = bytes(data.output);

    const difference = originalBytes - outputBytes;

    const percent = originalBytes === 0
      ? 0
      : (difference / originalBytes) * 100;

    $("originalSize").textContent =
      originalBytes.toLocaleString() + " B";

    $("outputSize").textContent =
      outputBytes.toLocaleString() + " B";

    $("sizeDifference").textContent =
      (difference > 0 ? "−" : difference < 0 ? "+" : "") +
      Math.abs(percent).toFixed(1) + "%";

    $("processingState").textContent = "Complete";

    $("outputFormat").textContent =
      data.format || "Luau source";

    setStatus(
      "Source processing completed.",
      "success"
    );

    setOutputStatus(
      "Output generated. Test it in Roblox Studio before using it.",
      "success"
    );

    log("Format: " + (data.format || "unknown"));

    if (Array.isArray(data.transformations)) {
      data.transformations.forEach(item => {
        log("Applied: " + String(item));
      });
    }

    if (Array.isArray(data.warnings)) {
      data.warnings.forEach(item => {
        log("Warning: " + String(item));
      });
    }

    log("Output size: " + outputBytes + " bytes.");
    log("Request completed.");

  } catch (error) {
    $("processingState").textContent = "Failed";

    const message = error instanceof Error
      ? error.message
      : "Unexpected error.";

    setStatus(message, "error");
    setOutputStatus(
      "No valid output was generated.",
      "error"
    );

    log("ERROR: " + message);

  } finally {
    protectBtn.disabled = false;
    protectBtn.textContent = "Protect Source";
  }
});

/* =========================================
   CHECK SOURCE - DIAGNOSTICS
========================================= */

const checkSourceBtn = $("checkSourceBtn");
const diagnosticsPanel = $("diagnosticsPanel");
const diagnosticsSummary = $("diagnosticsSummary");
const diagnosticsList = $("diagnosticsList");

if (
  checkSourceBtn &&
  diagnosticsPanel &&
  diagnosticsSummary &&
  diagnosticsList
) {
  checkSourceBtn.addEventListener("click", async () => {
    const source = sourceEl.value;

    if (!source.trim()) {
      diagnosticsPanel.hidden = false;
      diagnosticsList.replaceChildren();

      diagnosticsSummary.textContent =
        "Masukkan source code terlebih dahulu.";

      return;
    }

    if (source.length > 100000) {
      diagnosticsPanel.hidden = false;
      diagnosticsList.replaceChildren();

      diagnosticsSummary.textContent =
        "Source melebihi batas 100.000 karakter.";

      return;
    }

    checkSourceBtn.disabled = true;
    checkSourceBtn.textContent = "Checking...";

    diagnosticsPanel.hidden = false;
    diagnosticsList.replaceChildren();

    diagnosticsSummary.textContent =
      "Sedang memeriksa source code...";

    try {
      const response = await fetch("/api/diagnostics", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ source })
      });

      let data;

      try {
        data = await response.json();
      } catch {
        throw new Error(
          "Diagnostics API tidak mengembalikan JSON."
        );
      }

      if (!response.ok || !data.ok || !data.report) {
        throw new Error(
          data.error || "Diagnostics request failed."
        );
      }

      const report = data.report;
      const summary = report.summary || {};

      diagnosticsSummary.textContent =
        "Errors: " + Number(summary.errors || 0) +
        " | Warnings: " + Number(summary.warnings || 0) +
        " | Info: " + Number(summary.info || 0);

      const diagnostics = Array.isArray(report.diagnostics)
        ? report.diagnostics
        : [];

      if (diagnostics.length === 0) {
        const item = document.createElement("li");

        item.textContent =
          "No diagnostics reported by the current checks.";

        diagnosticsList.appendChild(item);
      }

      for (const diagnostic of diagnostics) {
        const item = document.createElement("li");

        const severity = String(
          diagnostic.severity || "info"
        ).toUpperCase();

        const sourceName = String(
          diagnostic.source || "diagnostics"
        );

        const message = String(
          diagnostic.message || "No message provided."
        );

        item.textContent =
          "[" + severity + "] " +
          sourceName + ": " +
          message;

        diagnosticsList.appendChild(item);
      }

      log("Source diagnostics completed.");
      log("Diagnostics found: " + diagnostics.length);

    } catch (error) {
      const message = error instanceof Error
        ? error.message
        : "Unable to check source.";

      diagnosticsSummary.textContent = message;

      log("DIAGNOSTICS ERROR: " + message);

    } finally {
      checkSourceBtn.disabled = false;
      checkSourceBtn.textContent = "Check Source";
    }
  });
} else {
  console.warn(
    "Diagnostics UI elements are missing from index.html."
  );
}

/* =========================================
   LOAD EXAMPLE
========================================= */

$("exampleBtn").addEventListener("click", () => {
  sourceEl.value = [
    "-- VXC example",
    "local x = 10",
    "local y = 20",
    "local result = x + y * 2",
    "return result"
  ].join("\n");

  setStatus("Example loaded. Press Protect Source.");
});

/* =========================================
   CLEAR
========================================= */

$("clearBtn").addEventListener("click", () => {
  sourceEl.value = "";

  resetOutput();

  setStatus("Source and output cleared.");
  setOutputStatus("No output generated yet.");

  logEl.textContent = "[VXC] Cleared.";

  if (diagnosticsPanel) {
    diagnosticsPanel.hidden = true;
  }

  if (diagnosticsList) {
    diagnosticsList.replaceChildren();
  }

  if (diagnosticsSummary) {
    diagnosticsSummary.textContent =
      "Belum ada pemeriksaan.";
  }
});

/* =========================================
   COPY OUTPUT
========================================= */

$("copyBtn").addEventListener("click", async () => {
  if (!outputEl.value) {
    setOutputStatus(
      "There is no output to copy.",
      "error"
    );
    return;
  }

  try {
    await navigator.clipboard.writeText(outputEl.value);

    setOutputStatus(
      "Output copied to clipboard.",
      "success"
    );

  } catch {
    outputEl.focus();
    outputEl.select();

    const success = document.execCommand("copy");

    setOutputStatus(
      success
        ? "Output copied."
        : "Copy failed; select and copy manually.",
      success ? "success" : "error"
    );
  }
});

/* =========================================
   DOWNLOAD OUTPUT
========================================= */

$("downloadBtn").addEventListener("click", () => {
  if (!outputEl.value) {
    setOutputStatus(
      "Protect source before downloading.",
      "error"
    );
    return;
  }

  const blob = new Blob(
    [outputEl.value],
    { type: "text/plain;charset=utf-8" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "vxc-protected.lua";

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);

  setOutputStatus(
    "Download started: vxc-protected.lua",
    "success"
  );
});

/* =========================================
   INITIALIZATION
========================================= */

log("API endpoint: /api/run");
log("Diagnostics endpoint: /api/diagnostics");
      </script>
